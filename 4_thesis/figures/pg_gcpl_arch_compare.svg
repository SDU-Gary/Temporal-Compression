<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <style>
      .title { font: 20px sans-serif; font-weight: 600; fill: #111; }
      .subtitle { font: 14px sans-serif; fill: #333; }
      .box { fill: #f7f7f7; stroke: #333; stroke-width: 1.5; rx: 8; ry: 8; }
      .box2 { fill: #eef5ff; stroke: #2a5bd7; stroke-width: 1.5; rx: 8; ry: 8; }
      .box3 { fill: #fff5e6; stroke: #c97a00; stroke-width: 1.5; rx: 8; ry: 8; }
      .text { font: 13px sans-serif; fill: #111; }
      .small { font: 12px sans-serif; fill: #333; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Titles -->
  <text x="120" y="40" class="title">V1: PG-GCPL (Fixed Physics Basis)</text>
  <text x="820" y="40" class="title">V2: Unified (Light-Set + Dynamic Basis)</text>

  <!-- V1 Column -->
  <rect x="80" y="80" width="520" height="620" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="10" ry="10" />

  <rect x="130" y="120" width="420" height="70" class="box" />
  <text x="150" y="150" class="text">Input: single light params θ (1D/5D)</text>
  <text x="150" y="170" class="small">[zenith, azimuth, intensity, temp, cloud]</text>

  <line x1="340" y1="190" x2="340" y2="220" class="arrow" />

  <rect x="130" y="220" width="420" height="70" class="box" />
  <text x="150" y="250" class="text">Physics Basis Φ(θ)</text>
  <text x="150" y="270" class="small">sin/cos + hand-crafted features</text>

  <line x1="340" y1="290" x2="340" y2="330" class="arrow" />

  <rect x="130" y="330" width="420" height="90" class="box" />
  <text x="150" y="360" class="text">Low-rank per Gaussian</text>
  <text x="150" y="380" class="small">U_j @ (C_j @ Φ(θ))</text>
  <text x="150" y="400" class="small">U_j fixed, C_j fixed</text>

  <line x1="340" y1="420" x2="340" y2="470" class="arrow" />

  <rect x="130" y="470" width="420" height="90" class="box" />
  <text x="150" y="500" class="text">Gaussian Mixture G_j(p)</text>
  <text x="150" y="520" class="small">Top-k spatial weighting</text>

  <line x1="340" y1="560" x2="340" y2="610" class="arrow" />

  <rect x="130" y="610" width="420" height="70" class="box" />
  <text x="150" y="640" class="text">Output: SH(p, θ)</text>
  <text x="150" y="660" class="small">27 coefficients (RGB)</text>

  <!-- V2 Column -->
  <rect x="780" y="80" width="520" height="620" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="10" ry="10" />

  <rect x="830" y="120" width="420" height="90" class="box2" />
  <text x="850" y="150" class="text">Input: Light Set {L_i}</text>
  <text x="850" y="170" class="small">12D descriptor + mask (N lights)</text>
  <text x="850" y="190" class="small">[Type, RGB, Pos, Dir, Meta1, Meta2]</text>

  <line x1="1040" y1="210" x2="1040" y2="250" class="arrow" />

  <rect x="830" y="250" width="420" height="90" class="box2" />
  <text x="850" y="280" class="text">LightSet Encoder Ψ</text>
  <text x="850" y="300" class="small">Embed = RGB * MLP(features)</text>
  <text x="850" y="320" class="small">Sum Pooling → Z</text>

  <line x1="1040" y1="340" x2="1040" y2="380" class="arrow" />

  <rect x="830" y="380" width="420" height="120" class="box2" />
  <text x="850" y="410" class="text">Dynamic Basis (FiLM)</text>
  <text x="850" y="430" class="small">U'_j = U_j ⊙ (1+γ(Z)) + β(Z)</text>
  <text x="850" y="450" class="small">Coeffs: C_j @ Z</text>
  <text x="850" y="470" class="small">Linearity loss (optional)</text>

  <line x1="1040" y1="500" x2="1040" y2="540" class="arrow" />

  <rect x="830" y="540" width="420" height="80" class="box2" />
  <text x="850" y="570" class="text">Gaussian Mixture G_j(p)</text>
  <text x="850" y="590" class="small">Top-k spatial weighting</text>

  <line x1="1040" y1="620" x2="1040" y2="660" class="arrow" />

  <rect x="830" y="660" width="260" height="60" class="box3" />
  <text x="850" y="690" class="text">L0 Branch (RGB)</text>
  <text x="850" y="710" class="small">Softplus for positivity</text>

  <rect x="1090" y="660" width="160" height="60" class="box" />
  <text x="1105" y="690" class="text">Output SH</text>
  <text x="1105" y="710" class="small">27 coeffs</text>

  <line x1="960" y1="720" x2="1090" y2="720" class="arrow" />

  <!-- Footer notes -->
  <text x="80" y="740" class="subtitle">V1: fixed physics basis, fixed U_j. Inputs are fixed-dimension θ.</text>
  <text x="780" y="740" class="subtitle">V2: light-set input, linear intensity encoding, dynamic basis, L0 branch.</text>
</svg>
