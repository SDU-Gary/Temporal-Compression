id: PGCPL_BISTRO_SMOKE

dataset:
  config: 1_data_generation/configs/bistro_smoke.yaml
  preset: smoke

train:
  entry: 3_experiments/scripts/train.py
  args:
    variant: unified_set
    batch_size: 64
    epochs: 100
    seed: 42

eval:
  entry: 3_experiments/scripts/eval.py
  args:
    checkpoint: 3_experiments/results/bistro_clean_v2/unified_set_K30_r8/best_model.pt
    output: 3_experiments/output/bistro_smoke_eval/eval.json

viz:
  rerun: true
