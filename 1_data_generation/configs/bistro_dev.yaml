name: bistro_dev
output_dir: 1_data_generation/output/bistro_temporal/dev

generator:
  script: 1_data_generation/falcor/generate_bistro_temporal_spheres.py
  args:
    scene: 1_data_generation/falcor/scenes/bistro_exterior_emissive_spheres.pyscene
    num_frames: 200
    fps: 30
    sh_mode: cubemap
    cube_res: 16
    spp: 32
    accum_frames: 1
    probe_mode: adaptive
    max_probes: 200
    probe_uniform_ratio: 0.7
    use_emissive_lights: true

presets:
  dev:
    args:
      cube_res: 16
      spp: 32
      max_probes: 200
