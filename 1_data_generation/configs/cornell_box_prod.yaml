name: cornell_box_prod
output_dir: 1_data_generation/output/cornell_box/prod

generator:
  script: 1_data_generation/falcor/generate_bistro_temporal_spheres.py
  args:
    scene: 1_data_generation/falcor/scenes/cornell_box_sun.pyscene
    num_frames: 200
    fps: 30
    sh_mode: cubemap
    cube_res: 32
    spp: 256
    accum_frames: 1
    probe_mode: adaptive
    max_probes: 200
    probe_uniform_ratio: 0.7
    use_emissive_lights: true

presets:
  prod:
    args:
      cube_res: 32
      spp: 256
      max_probes: 200

  smoke:
    args:
      num_frames: 40
      cube_res: 16
      spp: 64
      max_probes: 128