name: bistro_smoke
output_dir: 1_data_generation/output/bistro_temporal/smoke

generator:
  script: 1_data_generation/falcor/generate_bistro_temporal_spheres.py
  args:
    scene: 1_data_generation/falcor/scenes/bistro_exterior_emissive_spheres.pyscene
    num_frames: 60
    fps: 30
    sh_mode: cubemap
    cube_res: 8
    spp: 16
    accum_frames: 1
    probe_mode: adaptive
    max_probes: 64
    probe_uniform_ratio: 0.7
    use_emissive_lights: true

presets:
  smoke:
    args:
      num_frames: 30
      cube_res: 8
      spp: 8
      max_probes: 32
