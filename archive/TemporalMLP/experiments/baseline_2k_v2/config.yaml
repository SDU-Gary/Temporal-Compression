data:
  batch_size: 64
  dataset_path: ../data_generation/output/dataset_2k
  num_workers: 4
  pin_memory: true
  train_ratio: 0.6
  val_ratio: 0.2
experiment:
  device: cuda
  name: baseline_2k_v2
  output_dir: experiments/baseline_2k_v2
  seed: 42
gaussian_init:
  max_iter: 100
  method: kmeans
  tol: 0.0001
model:
  decoder_mlp:
    activation: relu
    hidden_dim: 64
    input_dim: 15
    num_layers: 2
    output_dim: 27
  latent_dim_base: 6
  latent_dim_time: 9
  num_gaussians: 250
  temporal_mlp:
    activation: relu
    hidden_dim: 32
    input_dim: 9
    num_layers: 2
training:
  early_stopping:
    enabled: true
    min_delta: 1.0e-05
    patience: 20
  grad_clip: 1.0
  log_interval: 100
  loss:
    energy_conservation: 0.0
    reconstruction: 1.0
    temporal_norm: l2
    temporal_smooth: 0.02
  max_checkpoints: 3
  num_steps: 10000
  optimizer:
    gaussians:
      betas:
      - 0.9
      - 0.999
      lr: 0.008
      type: Adam
      weight_decay: 0.015
    mlp:
      betas:
      - 0.9
      - 0.999
      lr: 0.0008
      type: Adam
      weight_decay: 0.0005
  save_interval: 1000
  scheduler:
    enabled: true
    min_lr: 1.0e-06
    warmup_steps: 1000
  val_interval: 250
validation:
  num_visualization: 4
