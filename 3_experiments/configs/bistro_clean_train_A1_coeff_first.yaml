experiment:
  variant: unified_set
  output_dir: 3_experiments/results/bistro_clean_v2/exp_A1_coeff_first
  device: cuda
  seed: 42

data:
  data_root: 1_data_generation/output/bistro_clean_v2
  train_ratio: 0.7
  val_ratio: 0.15
  batch_size: 512
  num_workers: 4

model:
  num_gaussians: 30
  rank: 8
  top_k: 3
  light_dim: 12
  embed_dim: 32
  intensity_dim: 3
  intensity_offset: 1
  disable_film: false

training:
  epochs: 2000
  lr: 1.0e-3
  weight_decay: 0.0
  lr_scheduler: none
  lr_min: 1.0e-4
  warmup_epochs: 0

  recon_loss: charbonnier
  lambda_temporal: 0.001
  lambda_linearity: 0.1
  linearity_aug_pairs: 2
  enable_sh_scaler: false
  enable_weighted_sh_loss: false
  lambda_image: 0.0

  staged:
    enabled: true
    stages:
      - name: coeff
        epochs: 1200
        lr: 1.0e-3
        trainable_groups: [coeff, encoder]
        best_metric: mae
      - name: joint
        epochs: 800
        lr: 5.0e-4
        trainable_groups: [all]
        best_metric: mae

evaluation:
  output_dir: 3_experiments/results/bistro_clean_v2/exp_A1_coeff_first/eval
  checkpoint: 3_experiments/results/bistro_clean_v2/exp_A1_coeff_first/best_model.pt
  data_root: 1_data_generation/output/bistro_clean_v2
  rank: 8
  n_samples: 20
  probe_idx: 0
