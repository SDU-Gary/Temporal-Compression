# Baseline configuration for multi-temporal lighting compression
# Stage 1-2: Single-level spatial compression with temporal modeling

experiment:
  name: "baseline_stage1-2"
  output_dir: "experiments/baseline"
  device: "cuda"
  seed: 42

data:
  dataset_path: "../data_generation/output/method_test_v1"
  train_ratio: 0.6           # 60% for training
  val_ratio: 0.2             # 20% for validation (20% will be test)
  batch_size: 64             # Smaller batch size for more frequent updates (205 samples / 64 = ~3 batches per epoch)
  num_workers: 4
  pin_memory: true

model:
  # Gaussian mixture parameters
  num_gaussians: 250         # Must be <= number of probe positions (343 total, 273 train+val)
  latent_dim_base: 6         # Base latent code dimension (F_j^base)
  latent_dim_time: 9         # Time-varying latent code dimension (F_j(t))

  # Temporal MLP: [F_j^base, sun_dir] -> F_j(t)
  temporal_mlp:
    input_dim: 9             # latent_dim_base (6) + sun_dir (3)
    hidden_dim: 32
    num_layers: 2
    activation: "relu"

  # Decoder MLP: [F(p,t), p] -> SH coefficients
  decoder_mlp:
    input_dim: 15            # latent_dim_time (9) + position (3) + time_encoding (3)
    hidden_dim: 64
    num_layers: 2
    output_dim: 27           # 2nd order SH (9 bases × 3 RGB)
    activation: "relu"

training:
  num_steps: 10000
  log_interval: 100          # Log every N steps
  val_interval: 500          # Validate every N steps
  save_interval: 1000        # Save checkpoint every N steps
  max_checkpoints: 3         # Keep last 3 checkpoints

  # Dual optimizer setup
  optimizer:
    gaussians:
      type: "Adan"
      lr: 0.01
      betas: [0.98, 0.92, 0.99]
      eps: 1.0e-8
      weight_decay: 0.02

    mlp:
      type: "Adam"
      lr: 0.001
      betas: [0.9, 0.999]
      weight_decay: 1.0e-5

  # Learning rate scheduling
  scheduler:
    enabled: true
    warmup_steps: 1000
    min_lr: 1.0e-6

  # Loss weights
  loss:
    reconstruction: 1.0      # L2 loss on SH coefficients
    temporal_smooth: 0.01    # Temporal consistency
    energy_conservation: 0.0 # Physics constraint (Stage 3+)
    temporal_norm: "l2"      # l1 or l2

  # Gradient clipping
  grad_clip: 1.0

validation:
  num_visualization: 4       # Number of samples to visualize

# Gaussian initialization
gaussian_init:
  method: "kmeans"           # K-Means clustering on probe positions
  max_iter: 100
  tol: 1.0e-4
