experiment:
  variant: unified_set
  output_dir: 3_experiments/results/bistro_clean_v2/unified_set_K50_r16_plain
  device: cuda
  seed: 42

data:
  data_root: 1_data_generation/output/bistro_clean_v2
  train_ratio: 0.7
  val_ratio: 0.15
  batch_size: 512
  num_workers: 4

model:
  num_gaussians: 50
  rank: 16
  top_k: 3
  light_dim: 12
  embed_dim: 32
  intensity_dim: 3
  intensity_offset: 1
  disable_film: false

training:
  epochs: 2000
  lr: 1.0e-3
  recon_loss: charbonnier
  lambda_temporal: 0.001
  lambda_linearity: 0.1
  linearity_aug_pairs: 2
  enable_sh_scaler: false
  enable_weighted_sh_loss: false
  lambda_image: 0.0

evaluation:
  output_dir: 3_experiments/results/bistro_clean_v2/unified_set_K50_r16_plain/eval
  checkpoint: 3_experiments/results/bistro_clean_v2/unified_set_K50_r16_plain/best_model.pt
  data_root: 1_data_generation/output/bistro_clean_v2
  rank: 16
  n_samples: 20
  probe_idx: 0
