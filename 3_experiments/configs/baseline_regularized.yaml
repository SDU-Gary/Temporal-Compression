# Regularized baseline to prevent overfitting
experiment:
  name: "baseline_regularized"
  output_dir: "experiments/baseline_regularized"
  device: "cuda"
  seed: 42

data:
  dataset_path: "../data_generation/output/method_test_v1"
  train_ratio: 0.6
  val_ratio: 0.2
  batch_size: 32             # Smaller batch for better generalization
  num_workers: 4
  pin_memory: true

model:
  num_gaussians: 150         # Reduced from 250 to reduce model capacity
  latent_dim_base: 6
  latent_dim_time: 9

  temporal_mlp:
    input_dim: 9
    hidden_dim: 32
    num_layers: 2
    activation: "relu"

  decoder_mlp:
    input_dim: 15
    hidden_dim: 64
    num_layers: 2
    output_dim: 27
    activation: "relu"

training:
  num_steps: 5000            # Reduced from 10000 - early stopping point
  log_interval: 100
  val_interval: 250          # More frequent validation
  save_interval: 1000
  max_checkpoints: 3

  optimizer:
    gaussians:
      type: "Adam"
      lr: 0.005              # Reduced from 0.01
      betas: [0.9, 0.999]
      weight_decay: 0.01     # Increased from 0.02 → 0.01 for regularization

    mlp:
      type: "Adam"
      lr: 0.0005             # Reduced from 0.001
      betas: [0.9, 0.999]
      weight_decay: 0.001    # Increased from 1e-5 → 0.001 for stronger regularization

  scheduler:
    enabled: true
    warmup_steps: 500        # Reduced warmup
    min_lr: 1e-6

  loss:
    reconstruction: 1.0
    temporal_smooth: 0.1     # Increased from 0.01 → 0.1 for stronger regularization
    energy_conservation: 0.0
    temporal_norm: "l2"

  grad_clip: 1.0

  # Early stopping to prevent overfitting
  early_stopping:
    enabled: true
    patience: 10           # Stop if no improvement for 10 validation checks
    min_delta: 1.0e-5      # Minimum change to qualify as improvement

validation:
  num_visualization: 4

gaussian_init:
  method: "kmeans"
  max_iter: 100
  tol: 1.0e-4
